<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>netplay-kit の試し</title>
    <style>
        body { font-family: sans-serif; margin: 16px; }
        button { margin: 4px 4px 4px 0; }
        pre { background: #f4f4f4; padding: 8px; white-space: pre-wrap; font-size: 12px; }
    </style>
</head>
<body>
    <!-- 通し試験（examples/e2e.mjs）用の最小の画面。サンプル②（中継）の部屋を操作する -->
    <input id="name" placeholder="名前">
    <input id="code" placeholder="部屋番号" inputmode="numeric">
    <label><input type="checkbox" id="public"> 公開にする</label>
    <div>
        <button id="create">部屋を作る</button>
        <button id="find">公開の部屋を探す</button>
        <button id="join">参加する</button>
        <button id="watch">観戦する</button>
        <button id="find-watch">観戦できる部屋を探す</button>
        <button id="start">開始</button>
        <button id="attack">攻撃を送る</button>
        <button id="stamp">👍</button>
        <button id="leave">部屋を出る</button>
    </div>
    <ul id="rooms"></ul>
    <p id="status">未接続</p>
    <pre id="log"></pre>

    <!-- ビルドなしの <script> 読み込み（mine-blocks と同じ形） -->
    <script src="../../client/netplay-client.js"></script>
    <script>
        const $ = (id) => document.getElementById(id);
        const net = new NetplayClient({
            serverUrl: NetplayClient.resolveServerUrl({ deployed: null }),
            storageKey: 'netplayKit.example'
        });
        const received = [];
        window.net = net;
        window.received = received;

        net.on('message', (message) => {
            received.push(message);
            $('log').textContent = received.map(m => m.type).join(' ');
        });
        net.on('connection', (connected) => { $('status').textContent = connected ? '接続中' : '切断'; });
        net.on('joined', (joined) => net.setRoomUrl(joined.roomCode));
        net.on('left', () => net.setRoomUrl(null));

        $('create').onclick = () => net.createRoom($('name').value, { public: $('public').checked });
        $('find').onclick = () => showRooms();
        $('find-watch').onclick = () => showRooms({ spectate: true });
        $('join').onclick = () => net.joinRoom($('code').value, $('name').value);
        // 観戦：席を持たずに入る（対戦中でも入れる）。観戦者の操作はサーバーが断る
        $('watch').onclick = () => net.spectate($('code').value, $('name').value).catch(error => { $('status').textContent = error.message; });
        $('start').onclick = () => net.start();
        $('attack').onclick = () => net.send('relay', { kind: 'attack', data: { lines: 2 } });
        $('stamp').onclick = () => net.stamp('👍');
        $('leave').onclick = () => net.leave();

        // 公開の部屋の一覧（サーバーはテーブルを Scan するので、押したときだけ取り、取り続けない）
        // spectate: true なら、観戦できる部屋（対戦中の公開の部屋）の一覧
        async function showRooms({ spectate = false } = {}) {
            $('rooms').textContent = '探しています…';
            try {
                const rooms = await net.listRooms({ spectate });
                if (!rooms.length) {
                    $('rooms').textContent = spectate ? '観戦できる部屋はありません' : '待っている部屋はありません';
                    return;
                }
                // 名前は参加者が入れた文字なので、textContent で描く
                $('rooms').replaceChildren(...rooms.map(room => {
                    const button = document.createElement('button');
                    button.textContent = spectate
                        ? `${room.hostName}の部屋を観戦（観戦${room.spectators}/${room.maxSpectators}人）`
                        : `${room.hostName}の部屋（${room.players}/${room.maxPlayers}人）`;
                    button.dataset.roomCode = room.roomCode;
                    button.onclick = () => enterPublicRoom(room.roomCode, { spectate });
                    const item = document.createElement('li');
                    item.append(button);
                    return item;
                }));
            } catch (error) {
                $('rooms').textContent = `一覧を取れませんでした（${error.code}）`;
            }
        }

        // 一覧を取ったあとで始まった・満員になった・消えた部屋なら、一覧を取り直す
        async function enterPublicRoom(roomCode, { spectate = false } = {}) {
            try {
                await net.enterRoom(roomCode, $('name').value, { spectate });
                $('rooms').replaceChildren();
            } catch (error) {
                if (['already_started', 'room_full', 'room_not_found', 'spectators_full'].includes(error.code)) showRooms({ spectate });
            }
        }

        // 招待URL（?room=）で開いたら部屋番号を入れ、前に入った部屋なら同じ席に戻る
        const roomCode = NetplayClient.roomCodeFromUrl();
        if (roomCode) {
            $('code').value = roomCode;
            if (net.session?.roomCode === roomCode) net.resume();
        }
    </script>
</body>
</html>
