AWSTemplateFormatVersion: '2010-09-09'
# GitHub Actions からのログインを受け付ける OIDC プロバイダ。アカウントに1つだけで、全ゲームで共有する（同期はしない）
# アカウントにすでにあるなら、このスタックは作らない。手順は README の「GitHub Actions での自動デプロイ」を参照
Description: GitHub Actions OIDC provider shared by netplay-kit games

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

Outputs:
  ProviderArn:
    Value: !Ref GitHubOidcProvider
